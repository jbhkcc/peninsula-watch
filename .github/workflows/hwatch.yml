name: H-WATCH Hourly Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '28 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Extract website
        run: unzip -q hwatch-v3-free.zip -d site

      - name: Update public data and risk assessment
        run: python3 site/scripts/update.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
