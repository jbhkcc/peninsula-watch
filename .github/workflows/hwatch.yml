name: H-WATCH Hourly Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '28 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: unzip -q hwatch.zip -d site

      - name: Update public data
        run: |
          cd site
          python3 scripts/update.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
